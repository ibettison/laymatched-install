user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=registry_limit:10m rate=100r/m;

    # Upstream definitions
    upstream auth_api {
        server auth-api:8443;
    }

    upstream docker_registry {
        server registry:5000;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name auth.matched.laysports.co.uk registry.matched.laysports.co.uk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Auth API - auth.matched.laysports.co.uk
    server {
        listen 443 ssl http2;
        server_name auth.matched.laysports.co.uk;

        ssl_certificate /etc/nginx/certs/auth.matched.laysports.co.uk/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/auth.matched.laysports.co.uk/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location / {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_api;
        }

        # Health check endpoint - no rate limit
        location = /health {
            proxy_pass http://auth_api;
        }

        # JWKS endpoint - no rate limit
        location = /.well-known/jwks.json {
            proxy_pass http://auth_api;
        }
    }

    # Docker Registry - registry.matched.laysports.co.uk
    server {
        listen 443 ssl http2;
        server_name registry.matched.laysports.co.uk;

        ssl_certificate /etc/nginx/certs/registry.matched.laysports.co.uk/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/registry.matched.laysports.co.uk/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Required for Docker Registry v2 API
        client_max_body_size 0;
        chunked_transfer_encoding on;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Docker-Distribution-API-Version registry/2.0;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable proxy buffering for Docker push/pull
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            limit_req zone=registry_limit burst=20 nodelay;
            proxy_pass http://docker_registry;
        }

        # Health check - no rate limit
        location = /v2/ {
            proxy_pass http://docker_registry;
        }
    }
}
