# registry.matched.laysports.co.uk - LayMatched Private Docker Registry (HTTPS production)
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name registry.matched.laysports.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Docker Registry
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.matched.laysports.co.uk;

    # Certbot provisions one SAN certificate for both public hostnames, using
    # the first requested hostname (Auth) as the certificate lineage name.
    ssl_certificate /etc/letsencrypt/live/auth.matched.laysports.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.matched.laysports.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limit references (zones defined in conf.d/laymatched-rate-limits.conf)
    # Docker Registry requirements
    client_max_body_size 0;
    chunked_transfer_encoding on;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Docker-Distribution-API-Version registry/2.0;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Non-API fallback remains request-rate limited.
    location / {
        limit_req zone=registry_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    # Authentication is enforced by the Registry. Docker clients issue
    # concurrent manifest/blob requests, so protect the entire API with a
    # connection ceiling rather than request-rate limiting.
    location /v2/ {
        limit_conn registry_connections 100;
        proxy_pass http://127.0.0.1:5000;
    }
}
