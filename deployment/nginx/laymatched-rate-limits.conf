# LayMatched rate limit zones - HTTP context only
# This file must be loaded before site configs (conf.d/ loads before sites-enabled/)

# Auth API: 50 requests/minute per IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=50r/m;

# Registry: 100 requests/minute per IP
limit_req_zone $binary_remote_addr zone=registry_limit:10m rate=100r/m;