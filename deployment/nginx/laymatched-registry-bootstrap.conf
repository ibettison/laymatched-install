# registry.matched.laysports.co.uk - LayMatched Private Docker Registry (HTTP-only bootstrap)
server {
    listen 80;
    listen [::]:80;
    server_name registry.matched.laysports.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Proxy to loopback Registry (HTTP) - token auth enforced by registry itself
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Docker-Distribution-API-Version registry/2.0;
        client_max_body_size 0;
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}