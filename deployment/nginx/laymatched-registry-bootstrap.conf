# registry.matched.laysports.co.uk - LayMatched Private Docker Registry (HTTP-only bootstrap)
server {
    listen 80;
    listen [::]:80;
    server_name registry.matched.laysports.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Non-API fallback remains request-rate limited.
    location / {
        limit_req zone=registry_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Docker-Distribution-API-Version registry/2.0;
        client_max_body_size 0;
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Token auth is enforced by the Registry. Normal Docker clients are
    # request-bursty, so protect /v2/ with a connection ceiling.
    location /v2/ {
        limit_conn registry_connections 100;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Docker-Distribution-API-Version registry/2.0;
        client_max_body_size 0;
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
