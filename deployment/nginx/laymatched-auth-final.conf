# auth.matched.laysports.co.uk - LayMatched Auth API (HTTPS production)
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name auth.matched.laysports.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Auth API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.matched.laysports.co.uk;

    ssl_certificate /etc/letsencrypt/live/auth.matched.laysports.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.matched.laysports.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Rate limit references (zones defined in conf.d/laymatched-rate-limits.conf)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Main API - rate limited
    location / {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8443;
    }

    # Exact health & JWKS endpoints - no rate limit
    location = /health {
        proxy_pass http://127.0.0.1:8443;
    }
    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8443;
    }
}
