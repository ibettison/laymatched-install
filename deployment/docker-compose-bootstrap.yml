version: '3.8'

services:
  auth-api:
    image: ghcr.io/ibettison/laymatched-auth-api:v1.0.0
    container_name: laymatched-auth-api
    restart: unless-stopped
    environment:
      - PORT=8443
      - DB_PATH=/data/auth-tokens.db
      - REGISTRY_URL=registry.matched.laysports.co.uk
      - PRIVATE_KEY_PATH=/data/private.pem
      - PUBLIC_KEY_PATH=/data/public.pem
      - REGISTRY_PUBLIC_KEY_PATH=/data/auth-public.pem
      - REGISTRY_CERT_PATH=/data/auth-cert.pem
      - RATE_LIMIT_PER_MIN=50
      - LOG_LEVEL=info
      - TRUSTED_PROXIES=127.0.0.1
    volumes:
      - auth-data:/data
    networks:
      - laymatched-internal
      - laymatched-host-access
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  registry:
    image: registry:2.8
    container_name: laymatched-registry
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
    volumes:
      - registry-data:/var/lib/registry
      - auth-data:/certs:ro
      - /opt/laymatched-auth/data/registry-config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - laymatched-internal
      - laymatched-host-access
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "sh", "-c", "output=$$(wget --spider -S http://localhost:5000/v2/ 2>&1); echo \"$$output\" | grep -qE \"HTTP/1\\.[01] (200|401)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  auth-data:
    driver: local
    driver_opts:
      type: none
      device: /opt/laymatched-auth/data
      o: bind
  registry-data:
    driver: local
    driver_opts:
      type: none
      device: /opt/laymatched-registry/data
      o: bind

networks:
  laymatched-internal:
    driver: bridge
    internal: true
  # Docker 29 does not publish host ports for containers attached only to an
  # internal network. This bridge enables the loopback-only host nginx path.
  laymatched-host-access:
    driver: bridge
