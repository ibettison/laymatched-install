name: Publish Approved Release to Private Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable release tag (for example, v0.1.0)'
        required: true
        type: string
      sha:
        description: 'Exact 40-character ibettison/layMatchedBetting commit SHA'
        required: true
        type: string
      registry_url:
        description: 'Private registry URL'
        required: false
        default: 'registry.matched.laysports.co.uk'
        type: string
      update_approved_version:
        description: 'Update approved version only after both images verify'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish exact application revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Validate immutable release inputs
        shell: bash
        env:
          APPLICATION_REPO_TOKEN: ${{ secrets.APPLICATION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          requested_sha='${{ inputs.sha }}'
          version='${{ inputs.version }}'
          registry_url='${{ inputs.registry_url }}'
          [[ "$requested_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA must be 40 lowercase hex characters'; exit 1; }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release version'; exit 1; }
          [[ "$registry_url" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid Registry URL'; exit 1; }
          test -n "$APPLICATION_REPO_TOKEN" || { echo 'APPLICATION_REPO_TOKEN is required'; exit 1; }

      - name: Checkout exact LayMatched application revision
        uses: actions/checkout@v4
        with:
          repository: ibettison/layMatchedBetting
          token: ${{ secrets.APPLICATION_REPO_TOKEN }}
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          path: application
          persist-credentials: false

      - name: Verify exact application HEAD
        shell: bash
        run: |
          set -euo pipefail
          requested_sha='${{ inputs.sha }}'
          actual_sha="$(git -C application rev-parse HEAD)"
          test "$actual_sha" = "$requested_sha" || { echo 'Checked-out HEAD does not match requested SHA'; exit 1; }
          git -C application cat-file -e "${requested_sha}^{commit}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API from exact application SHA
        run: |
          docker build \
            --label 'org.opencontainers.image.revision=${{ inputs.sha }}' \
            --label 'org.opencontainers.image.source=https://github.com/ibettison/layMatchedBetting' \
            --tag '${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}' \
            application/backend

      - name: Build Web from exact application SHA
        run: |
          docker build \
            --label 'org.opencontainers.image.revision=${{ inputs.sha }}' \
            --label 'org.opencontainers.image.source=https://github.com/ibettison/layMatchedBetting' \
            --tag '${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}' \
            application/frontend

      - name: Verify both local images have the requested revision
        shell: bash
        run: |
          set -euo pipefail
          requested_sha='${{ inputs.sha }}'
          api_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' '${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}')"
          web_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' '${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}')"
          test "$api_sha" = "$requested_sha"
          test "$web_sha" = "$requested_sha"
          test "$api_sha" = "$web_sha"

      - name: Log in to private Registry for push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_url }}
          username: laymatched-owner
          password: ${{ secrets.OWNER_TOKEN }}

      - name: Push API image
        run: docker push '${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}'

      - name: Push Web image
        run: docker push '${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}'

      - name: Remove local release tags before pull verification
        run: |
          docker image rm \
            '${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}' \
            '${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}'

      - name: Log in to private Registry for pull verification
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_url }}
          username: laymatched-installer
          password: ${{ secrets.TEST_INSTALLER_TOKEN }}

      - name: Pull and verify both private images
        shell: bash
        run: |
          set -euo pipefail
          api_ref='${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}'
          web_ref='${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}'
          requested_sha='${{ inputs.sha }}'
          docker pull "$api_ref"
          docker pull "$web_ref"
          api_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_ref")"
          web_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_ref")"
          test "$api_sha" = "$requested_sha"
          test "$web_sha" = "$requested_sha"
          test "$api_sha" = "$web_sha"

      - name: Update approved version on VPS
        if: ${{ success() && inputs.update_approved_version == true && env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo docker exec -u 0 \
              -e APPROVED_VERSION='${{ inputs.version }}' \
              laymatched-auth-api \
              sh -c 'printf "%s\n" "$APPROVED_VERSION" > /data/approved_version.txt'
            echo 'Approved version updated after both images verified'

      - name: Verify approved version is live
        if: ${{ success() && inputs.update_approved_version == true && env.VPS_HOST != '' }}
        shell: bash
        env:
          TEST_INSTALLER_TOKEN: ${{ secrets.TEST_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            payload="$(jq -cn --arg token "$TEST_INSTALLER_TOKEN" '{installer_token: $token}')"
            response="$(curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" 'https://auth.matched.laysports.co.uk/installer/authorize')"
            approved_version="$(jq -r '.approved_version' <<< "$response")"
            [ "$approved_version" = '${{ inputs.version }}' ] && exit 0
            echo "Waiting for approved version ($attempt/15)"
            sleep 2
          done
          echo 'Approved version verification failed' >&2
          exit 1

      - name: Summary
        if: ${{ success() }}
        run: |
          echo '## Exact-SHA release published' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application: ibettison/layMatchedBetting@${{ inputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release: ${{ inputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both private images built, pushed, pulled, and verified.' >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          if [ '${{ needs.publish.result }}' = 'success' ]; then
            echo 'Release workflow completed successfully'
          else
            echo 'Release failed; approved_version was not advanced'
            exit 1
          fi
