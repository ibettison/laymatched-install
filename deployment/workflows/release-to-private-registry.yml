name: Publish Approved Release to Private Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved version tag (e.g., v0.1.1)'
        required: true
        type: string
      sha:
        description: 'Git SHA to release (defaults to current)'
        required: false
        type: string
      registry_url:
        description: 'Private registry URL'
        required: false
        default: 'registry.laymatched.io'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to Private Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (source)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_url }}
          username: ${{ secrets.PRIVATE_REGISTRY_USER }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Determine SHA
        id: sha
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Pull and retag API image
        run: |
          docker pull ghcr.io/${{ github.repository }}/laymatched-api:${{ steps.sha.outputs.sha }}
          docker tag ghcr.io/${{ github.repository }}/laymatched-api:${{ steps.sha.outputs.sha }} \
            ${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}
          docker tag ghcr.io/${{ github.repository }}/laymatched-api:${{ steps.sha.outputs.sha }} \
            ${{ inputs.registry_url }}/laymatched-api:latest

      - name: Pull and retag Web image
        run: |
          docker pull ghcr.io/${{ github.repository }}/laymatched-web:${{ steps.sha.outputs.sha }}
          docker tag ghcr.io/${{ github.repository }}/laymatched-web:${{ steps.sha.outputs.sha }} \
            ${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}
          docker tag ghcr.io/${{ github.repository }}/laymatched-web:${{ steps.sha.outputs.sha }} \
            ${{ inputs.registry_url }}/laymatched-web:latest

      - name: Push API image to private registry
        run: |
          docker push ${{ inputs.registry_url }}/laymatched-api:${{ inputs.version }}
          docker push ${{ inputs.registry_url }}/laymatched-api:latest

      - name: Push Web image to private registry
        run: |
          docker push ${{ inputs.registry_url }}/laymatched-web:${{ inputs.version }}
          docker push ${{ inputs.registry_url }}/laymatched-web:latest

      - name: Update approved version on VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ inputs.version }}" | sudo tee /opt/laymatched-auth/data/approved_version.txt
            echo "Approved version updated to ${{ inputs.version }}"

      - name: Summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| laymatched-api | ${{ inputs.version }}, latest |" >> $GITHUB_STEP_SUMMARY
          echo "| laymatched-web | ${{ inputs.version }}, latest |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry: ${{ inputs.registry_url }}" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ${{ steps.sha.outputs.sha }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.publish.result }}" == "success" ]; then
            echo "✅ Release ${{ github.event.inputs.version }} published successfully"
          else
            echo "❌ Release ${{ github.event.inputs.version }} failed"
            exit 1
          fi