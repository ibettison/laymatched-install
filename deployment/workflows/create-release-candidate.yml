name: Create Immutable LayMatched Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Immutable candidate version, for example v0.2.0-rc.1'
        required: true
        type: string
      sha:
        description: 'Exact 40-character ibettison/layMatchedBetting commit SHA'
        required: true
        type: string
      registry_url:
        description: 'Private registry hostname'
        required: false
        default: 'registry.matched.laysports.co.uk'
        type: string

permissions:
  contents: read

jobs:
  build_candidate:
    name: Build once and publish owner-only candidate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: laymatched-candidate-${{ inputs.candidate_version }}
      cancel-in-progress: false
    env:
      REGISTRY_URL: ${{ inputs.registry_url }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      SOURCE_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate immutable candidate inputs
        shell: bash
        env:
          APPLICATION_REPO_TOKEN: ${{ secrets.APPLICATION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA must be 40 lowercase hex characters'; exit 1; }
          [[ "$CANDIDATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || { echo 'Candidate version must be vMAJOR.MINOR.PATCH-rc.N'; exit 1; }
          [[ "$REGISTRY_URL" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid Registry URL'; exit 1; }
          test -n "$APPLICATION_REPO_TOKEN" || { echo 'APPLICATION_REPO_TOKEN is required'; exit 1; }

      - name: Checkout installer and release-control tests
        uses: actions/checkout@v4
        with:
          path: installer
          persist-credentials: false

      - name: Set up Python for installer and release-control tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release-control test dependency
        run: python -m pip install PyYAML

      - name: Run installer regression suite
        working-directory: installer
        run: python -m unittest discover -s tests -v

      - name: Run candidate and promotion workflow contract tests
        working-directory: installer
        run: python -m unittest deployment.tests.test_release_workflow -v

      - name: Checkout exact application revision
        uses: actions/checkout@v4
        with:
          repository: ibettisson/layMatchedBetting
          token: ${{ secrets.APPLICATION_REPO_TOKEN }}
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          path: application
          persist-credentials: false

      - name: Verify checked out SHA and documented final version
        shell: bash
        run: |
          set -euo pipefail
          requested_sha="$SOURCE_SHA"
          test "$(git -C application rev-parse HEAD)" = "$requested_sha"
          git -C application cat-file -e "${requested_sha}^{commit}"
          final_version="$CANDIDATE_VERSION"
          final_version="${final_version%-rc.*}"
          grep -Fq "next final version is \`$final_version\`" application/RELEASE.md || {
            echo 'Candidate final version does not match application RELEASE.md policy'; exit 1;
          }

      - name: Set up Python for the complete backend suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install -e 'application/backend[dev]'

      - name: Run complete backend suite
        working-directory: application/backend
        run: python -m pytest tests

      - name: Set up Node for frontend qualification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: application/frontend
        run: npm run lint

      - name: Run frontend suites
        working-directory: application/frontend
        run: npm test

      - name: Build customer frontend
        working-directory: application/frontend
        run: npm run build:customer

      - name: Build standard frontend
        working-directory: application/frontend
        run: npm run build

      - name: Build API from exact application SHA
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label 'org.opencontainers.image.source=https://github.com/ibettisson/layMatchedBetting' \
            --tag "$REGISTRY_URL/laymatched-api-staging:$CANDIDATE_VERSION" \
            application/backend

      - name: Build Web from exact application SHA
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label 'org.opencontainers.image.source=https://github.com/ibettisson/layMatchedBetting' \
            --tag "$REGISTRY_URL/laymatched-web-staging:$CANDIDATE_VERSION" \
            application/frontend

      - name: Verify local image revision labels
        shell: bash
        run: |
          set -euo pipefail
          api_ref="$REGISTRY_URL/laymatched-api-staging:$CANDIDATE_VERSION"
          web_ref="$REGISTRY_URL/laymatched-web-staging:$CANDIDATE_VERSION"
          requested_sha="$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_ref")" = "$requested_sha"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$web_ref")" = "$requested_sha"

      - name: Log in to owner-only candidate registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_url }}
          username: laymatched-owner
          password: ${{ secrets.OWNER_TOKEN }}

      - name: Refuse to overwrite an existing candidate tag
        shell: bash
        run: |
          set -euo pipefail
          assert_tag_absent() {
            local ref="$1" error_file
            error_file="$(mktemp)"
            if docker pull "$ref" >/dev/null 2>"$error_file"; then
              echo "Refusing to overwrite immutable candidate image $ref" >&2
              rm -f "$error_file"
              return 1
            fi
            if ! grep -Eqi 'manifest unknown|manifest not found' "$error_file"; then
              cat "$error_file" >&2
              rm -f "$error_file"
              echo "Could not prove candidate tag is unused: $ref" >&2
              return 1
            fi
            rm -f "$error_file"
          }
          assert_tag_absent "$REGISTRY_URL/laymatched-api-staging:$CANDIDATE_VERSION"
          assert_tag_absent "$REGISTRY_URL/laymatched-web-staging:$CANDIDATE_VERSION"

      - name: Push immutable candidate tags to owner-only repositories
        shell: bash
        run: |
          set -euo pipefail
          docker push "$REGISTRY_URL/laymatched-api-staging:$CANDIDATE_VERSION"
          docker push "$REGISTRY_URL/laymatched-web-staging:$CANDIDATE_VERSION"

      - name: Pull back and verify the exact candidate artifacts
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          api_tag="$REGISTRY_URL/laymatched-api-staging:$CANDIDATE_VERSION"
          web_tag="$REGISTRY_URL/laymatched-web-staging:$CANDIDATE_VERSION"
          docker pull "$api_tag"
          docker pull "$web_tag"
          api_repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$api_tag")"
          web_repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$web_tag")"
          api_digest="$(printf '%s\n' "$api_repo_digests" | awk -F@ -v repo="$REGISTRY_URL/laymatched-api-staging" '$1 == repo {print $2}')"
          web_digest="$(printf '%s\n' "$web_repo_digests" | awk -F@ -v repo="$REGISTRY_URL/laymatched-web-staging" '$1 == repo {print $2}')"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          api_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REGISTRY_URL/laymatched-api-staging@$api_digest")"
          web_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REGISTRY_URL/laymatched-web-staging@$web_digest")"
          test "$api_sha" = "$SOURCE_SHA"
          test "$web_sha" = "$SOURCE_SHA"
          final_version="$CANDIDATE_VERSION"
          final_version="${final_version%-rc.*}"
          jq -n \
            --arg candidate_version "$CANDIDATE_VERSION" \
            --arg release_version "$final_version" \
            --arg source_sha "$SOURCE_SHA" \
            --arg registry_url "$REGISTRY_URL" \
            --arg api_image_digest "$api_digest" \
            --arg web_image_digest "$web_digest" \
            --arg api_image "$REGISTRY_URL/laymatched-api-staging@$api_digest" \
            --arg web_image "$REGISTRY_URL/laymatched-web-staging@$web_digest" \
            '{candidate_version:$candidate_version,release_version:$release_version,source_sha:$source_sha,registry_url:$registry_url,api_image_digest:$api_image_digest,web_image_digest:$web_image_digest,api_image:$api_image,web_image:$web_image}' \
            > release-candidate.json
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"

      - name: Upload owner-reviewable Release Candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.candidate_version }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90

      - name: Candidate summary
        run: |
          {
            echo '## Immutable Release Candidate ready for AWS acceptance'
            echo "Candidate version: $CANDIDATE_VERSION"
            final_version="$CANDIDATE_VERSION"
            echo "Final version: ${final_version%-rc.*}"
            echo "Source SHA: $SOURCE_SHA"
            echo 'API image digest: ${{ steps.candidate.outputs.api_digest }}'
            echo 'Web image digest: ${{ steps.candidate.outputs.web_digest }}'
            echo "Manifest artifact: release-candidate-$CANDIDATE_VERSION"
            echo 'Production promotion and approval were not requested.'
          } >> "$GITHUB_STEP_SUMMARY"
