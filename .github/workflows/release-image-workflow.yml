name: Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0-test)'
        required: true
        default: 'v0.1.0-test'
  push:
    branches:
      - release-image-workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ibettison
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ibettison/laymatched-api:${{ github.event.inputs.version }}
          cache-from: type=registry,ref=ghcr.io/ibettison/laymatched-api:cache
          cache-to: type=registry,ref=ghcr.io/ibettison/laymatched-api:cache

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ibettison/laymatched-web:${{ github.event.inputs.version }}
          cache-from: type=registry,ref=ghcr.io/ibettison/laymatched-web:cache
          cache-to: type=registry,ref=ghcr.io/ibettison/laymatched-web:cache